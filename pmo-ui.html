<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMO</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6eb; --text: #1b1f24; --muted: #6a737d;
    --accent: #2f6fed; --accent-soft: #e8f0fe; --ok: #1f9d55; --warn: #c27c0e; --bad: #c93c37; --off: #9aa3ad;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --line: #262c34; --text: #e6e9ee; --muted: #8b949e;
      --accent: #6ea0ff; --accent-soft: #1b2a45; --ok: #3fb96f; --warn: #e0a13a; --bad: #f0605a; --off: #5b636d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); }
  .spacer { flex: 1; }
  a { color: var(--accent); text-decoration: none; }
  button, textarea, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
  section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 16px 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .pad { padding: 4px 16px 16px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; border-radius: 0; padding: 7px 14px; background: transparent; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .modehelp { color: var(--muted); margin-top: 8px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
  .stat b { font-size: 20px; display: block; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .esc { border-top: 1px solid var(--line); padding: 14px 16px; }
  .esc:first-of-type { border-top: 0; }
  .esc .t { font-weight: 600; }
  .esc .q { white-space: pre-wrap; color: var(--text); margin: 6px 0; max-height: 160px; overflow: auto; font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .esc .why { color: var(--muted); font-size: 12px; }
  .esc textarea { width: 100%; min-height: 60px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); resize: vertical; margin: 6px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.auto-reply, .badge.sent, .badge.approved-by-you { color: var(--ok); border-color: var(--ok); }
  .badge.escalated { color: var(--warn); border-color: var(--warn); }
  .badge.error { color: var(--bad); border-color: var(--bad); }
  .badge.shadow-reply, .badge.shadow-escalate { color: var(--accent); border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  td { border-top: 1px solid var(--line); padding: 8px 16px; vertical-align: top; font-size: 13px; }
  td.time { color: var(--muted); white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; }
  td .what { color: var(--muted); }
  td .reply { white-space: pre-wrap; }
  .empty { padding: 16px; color: var(--muted); }
  .chat { display: flex; gap: 8px; }
  .chat input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  .sess { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; border-top: 1px solid var(--line); font-size: 13px; }
  .sess .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess.muted .name { color: var(--muted); text-decoration: line-through; }
  .err { color: var(--bad); }
  details > summary { cursor: pointer; list-style: none; }
  @media (max-width: 600px) { td.time { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>PMO</h1>
    <span class="sub" id="watch"></span>
    <span class="spacer"></span>
    <a href="http://127.0.0.1:3456/mux/ui">会话可见性 →</a>
  </header>

  <section>
    <h2>模式</h2>
    <div class="pad">
      <div class="seg" id="modes">
        <button data-m="off">关闭</button>
        <button data-m="shadow">观察</button>
        <button data-m="draft">草稿</button>
        <button data-m="auto">自动</button>
      </div>
      <div class="modehelp" id="modehelp"></div>
      <div class="stats" id="stats"></div>
      <div class="err" id="err"></div>
    </div>
  </section>

  <section>
    <h2>待你处理 <span class="badge" id="esccount">0</span></h2>
    <div id="escs"></div>
  </section>

  <section>
    <h2>和 PMO 说</h2>
    <div class="pad">
      <form class="chat" id="chat">
        <input id="chatText" placeholder="例如：artekne 上哪些在等我？ / 让 GCP 迁移那个先停下" autocomplete="off">
        <button class="primary">发送</button>
      </form>
      <div class="modehelp">回复会出现在眼镜上的 ★ PMO 会话里，也会进下面的日志。</div>
    </div>
  </section>

  <section>
    <h2>决策日志 <span class="spacer"></span><button id="review" title="把启动前就已在等待的会话也交给 PMO 判断">处理已在等待的会话</button></h2>
    <div id="log"></div>
  </section>

  <section>
    <details>
      <summary><h2 style="padding-bottom:12px">监听的会话 <span class="badge" id="sesscount">0</span>（点开可静音单个会话）</h2></summary>
      <div id="sessions"></div>
    </details>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HELP = {
  off: "不监听任何会话。",
  shadow: "只观察：判断并记录“本来会怎么做”，不发送任何东西。先在这里看几轮判断是否靠谱。",
  draft: "所有回复都先做成草稿，等你在眼镜或这里点“发送”。",
  auto: "低风险的直接替你回复；审批、部署/生产/删除/推送/付款/外发/密钥等，以及没把握的，一律交给你。",
};
const ACTION = { "auto-reply": "已自动回复", sent: "已发送", "approved-by-you": "你已审批", escalated: "交给你", skipped: "已跳过",
  none: "无需回复", error: "出错", "shadow-reply": "观察·本会回复", "shadow-escalate": "观察·本会交给你" };
let data = null, busy = false, editing = false;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

async function load() {
  if (busy || editing) return;
  busy = true;
  try { data = await api("/pmo/state"); render(); } catch (e) { $("#err").textContent = e.message; }
  busy = false;
}

function render() {
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.m === data.mode));
  $("#modehelp").textContent = HELP[data.mode] || "";
  $("#watch").textContent = `监听 ${data.watching} 个会话 · ${data.busy} 个在运行`;
  $("#stats").innerHTML = [
    [data.escalations.length, "待你处理"],
    [data.autoRepliesLastHour, `近 1 小时自动回复（上限 ${data.limits.perHour}）`],
    [data.log.filter((l) => l.action === "escalated").length, "近期交给你"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  $("#err").textContent = data.error || "";

  $("#esccount").textContent = data.escalations.length;
  $("#escs").innerHTML = data.escalations.length ? data.escalations.map((e) => `
    <div class="esc" data-id="${e.id}">
      <div class="row"><span class="t">${esc(e.title)}</span><span class="badge">${e.kind === "approval" ? "审批" : "在等你"}</span><span class="sub">${t(e.at)}</span></div>
      <div class="q">${esc(e.question)}</div>
      ${e.kind === "approval" ? `<div class="why">${esc(e.detail || e.reason)}</div>
        <div class="row" style="margin-top:8px">${e.options.map((o) => `<button data-esc="${e.id}" data-key="${esc(o.key)}">${esc(o.text)}</button>`).join("")}</div>`
      : `<textarea data-draft="${e.id}" placeholder="回复内容">${esc(e.draft)}</textarea>
        <div class="row"><button class="primary" data-esc="${e.id}" data-key="send">发送</button><button data-esc="${e.id}" data-key="skip">跳过</button>
        <span class="why">${esc(e.reason)}</span></div>`}
    </div>`).join("") : `<div class="empty">没有需要你处理的。</div>`;

  $("#log").innerHTML = data.log.length ? `<table>${data.log.map((l) => `
    <tr><td class="time">${t(l.at)}</td><td>
      <div class="row"><span class="badge ${esc(l.action)}">${ACTION[l.action] || esc(l.action)}</span><b>${esc(l.title || "")}</b></div>
      ${l.reply ? `<div class="reply">→ ${esc(l.reply)}</div>` : ""}
      <div class="what">${esc(l.reason || l.summary || "")}</div>
    </td></tr>`).join("")}</table>` : `<div class="empty">还没有决策。会话结束一轮、在等人时，这里会出现记录。</div>`;

  $("#sesscount").textContent = data.sessions.length;
  $("#sessions").innerHTML = data.sessions.map((s) => `
    <div class="sess ${s.muted ? "muted" : ""}"><span class="name">${esc(s.title)}</span>
      <span class="row"><span class="badge">${esc(s.status)}</span><button data-mute="${esc(s.id)}" data-m="${s.muted ? 0 : 1}">${s.muted ? "取消静音" : "静音"}</button></span></div>`).join("");
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  try {
    if (b.dataset.m && b.closest("#modes")) { await api("/pmo/mode", { mode: b.dataset.m }); }
    else if (b.dataset.esc) {
      const ta = document.querySelector(`textarea[data-draft="${b.dataset.esc}"]`);
      b.disabled = true;
      await api("/pmo/escalation", { id: b.dataset.esc, key: b.dataset.key, text: ta ? ta.value : undefined });
    } else if (b.dataset.mute) { await api("/pmo/mute", { sessionId: b.dataset.mute, muted: b.dataset.m === "1" }); }
    else if (b.id === "review") { const r = await api("/pmo/review-waiting", {}); b.textContent = `已加入 ${r.queued} 个`; setTimeout(() => (b.textContent = "处理已在等待的会话"), 4000); }
  } catch (e) { alert(e.message); }
  editing = false; load();
});
document.addEventListener("focusin", (e) => { if (e.target.matches("textarea")) editing = true; });
document.addEventListener("focusout", (e) => { if (e.target.matches("textarea")) setTimeout(() => (editing = false), 300); });
$("#chat").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#chatText").value.trim();
  if (!text) return;
  $("#chatText").value = "";
  try { await api("/pmo/chat", { text }); } catch (err) { alert(err.message); }
  setTimeout(load, 1500);
});
load();
setInterval(() => { if (!document.hidden) load(); }, 5000);
</script>
</body>
</html>
